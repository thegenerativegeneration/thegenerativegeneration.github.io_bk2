---
layout: default
---
Creative experiments, and projects to be.


<section>

  <div class="project-container">

    {% for experiment in site.data.settings.experiments %}
      <a href="/experiments/{{ experiment.url }}">
        <div class="project-unit" data-folder="/experiments/{{ experiment.url }}" style="background-image: url(/assets/img/experiments/{{ experiment.url }}/thumbnail.jpg)">
          <div class="project-overlay">
            <strong>{{ experiment.name }}</i></strong>
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
